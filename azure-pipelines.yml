# Azure DevOps CI pipeline for Umbraco.Cms.Integrations (v17 line)
#
# One pipeline for every package in the repo, replacing the previous
# one-yml-per-package arrangement.
#
# How it works:
#   1. DetectChanges discovers the packages under src/ (any folder with both a
#      .csproj and a version.json) and diffs against the appropriate base to
#      work out which ones actually changed.
#   2. Pack fans out over just those packages via a matrix, one job each.
#   3. On release/hotfix branches, GenerateSBOM scans the same packages with
#      umbraco-sbom, enforces license policy and uploads to Dependency-Track.
#      Pack waits for it, so a policy violation stops a release being packed.
#
# Packages here are independent siblings - none references another - so there is
# no build ordering, no dependency tiers and no shared runtime library.
# Adding a package needs no change to this file: give the new folder a
# version.json and it is picked up automatically.

# A build packs several packages at different versions, so there is no single
# version to name it after. Without this, each Pack matrix job's `nbgv cloud`
# would set the build number to its OWN package's version and the last job to
# finish would win - naming the whole build after one arbitrary package. The
# pack template passes --skip-cloud-build-number so this value survives.
name: $(SourceBranchName)-$(Date:yyyyMMdd)-$(BuildID)

parameters:
    # Queue-time override: generate SBOMs and run the license policy check on any
    # branch. SBOMs normally only run on v17/release/* and v17/hotfix/*, where they
    # are also uploaded to Dependency-Track. Elsewhere this covers every package and
    # never uploads, so in-progress versions don't land in Dependency-Track.
    - name: generateSbom
      displayName: Generate SBOMs and check licenses (no upload off release/hotfix)
      type: boolean
      default: false

trigger:
    branches:
        include:
            - main-v17
            - v17/dev
            # Release/hotfix branches are where publishable (clean-versioned)
            # artifacts are built - see publicReleaseRefSpec in each version.json.
            - v17/release/*
            - v17/hotfix/*
    paths:
        include:
            - src/**
            - tests/**
            - Directory.Packages.props
            - azure-pipelines.yml
            - .azure-pipelines/**
            - NuGet.config

pr:
    branches:
        include:
            - main-v17
            - v17/dev

pool:
    # Linux, matching Umbraco.Automate and Umbraco.AI. The hosted Windows images
    # no longer have Windows PowerShell 5.1 on PATH, and UseDotNet@2 shells out to
    # `powershell` to detect the OS - every Pack job died on
    # "Unable to locate executable file: 'powershell'" on both windows-latest
    # (build 279692) and windows-2022 (build 279699). Linux is also cheaper and
    # faster, and nothing here is Windows-specific.
    vmImage: "ubuntu-latest"

variables:
    buildConfiguration: "Release"
    DT_API_KEY: $(dtApiKey)
    DT_BASE_URL: $(dtBaseUrl)
    # npm reads this, so pointing it at the workspace puts the download cache
    # somewhere Cache@2 can save and restore. See pack-product.yml.
    npm_config_cache: $(Pipeline.Workspace)/.npm

stages:
    - stage: DetectChanges
      displayName: "Detect changed packages"
      jobs:
          - job: Detect
            displayName: "Detect changes"
            steps:
                - checkout: self
                  # Full history so merge-base comparisons work.
                  fetchDepth: 0

                - task: PowerShell@2
                  name: detect
                  displayName: "Run change detection"
                  inputs:
                      filePath: ".azure-pipelines/scripts/detect-changes.ps1"
                      pwsh: true

                # Fails the build if a version was bumped without a changelog entry.
                - task: PowerShell@2
                  displayName: "Validate changelogs"
                  inputs:
                      filePath: ".azure-pipelines/scripts/validate-changelogs.ps1"
                      pwsh: true

    - stage: Test
      displayName: "Test"
      dependsOn: DetectChanges
      # succeeded() is required - see the note on the Pack stage.
      condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['Detect.detect.AnyChanged'], 'true'))
      jobs:
          - job: RunTests
            displayName: "Run tests"
            steps:
                # Full history: the test project references Crm.Hubspot, which imports
                # NBGV, and NBGV throws on a shallow clone ("lacks the objects required
                # to calculate version height"). The agent default is a depth-1 fetch.
                - checkout: self
                  fetchDepth: 0

                - template: .azure-pipelines/templates/setup-dotnet.yml

                # Runs every test project in the solution. There is one today
                # (Crm.Hubspot); any project added under tests/ is picked up with no
                # change here. The client asset build is skipped - it produces no
                # inputs the tests use, and needs npm.
                - task: DotNetCoreCLI@2
                  displayName: "dotnet test"
                  inputs:
                      command: "test"
                      projects: "tests/**/*Tests.csproj"
                      # Do NOT pass --logger/--results-directory here: publishTestResults
                      # appends its own pair, and dotnet test rejects the command line with
                      # "Option '--results-directory' expects a single argument but 2 were
                      # provided."
                      arguments: '--configuration $(buildConfiguration) --collect "XPlat Code Coverage"'
                      publishTestResults: true
                      nugetConfigPath: "NuGet.config"

    # Generates an SBOM per package with umbraco-sbom (Umbraco.Internal.Sbom), which
    # also enforces license policy, and uploads it to Dependency-Track. Mirrors
    # Umbraco.AI (umbraco/Umbraco.AI#486) and Umbraco.Forms (umbraco/Forms#1597).
    #
    # Runs on pushes to release/hotfix branches only - the builds that ship - over the
    # same packages Pack builds (the release manifest's selection). With generateSbom
    # ticked at queue time it runs on any branch over every package, with no upload.
    #
    # `contains` rather than a v18-prefixed startsWith, as in Umbraco.AI, so the stage
    # ports to the v17 line unchanged; the trigger already limits release branches to
    # this line's.
    - stage: GenerateSBOM
      displayName: "Generate SBOMs"
      dependsOn: DetectChanges
      condition: |
          and(
            succeeded(),
            ne(variables['Build.Reason'], 'PullRequest'),
            or(
              eq('${{ parameters.generateSbom }}', 'true'),
              contains(variables['Build.SourceBranch'], '/release/'),
              contains(variables['Build.SourceBranch'], '/hotfix/')
            )
          )
      jobs:
          - job: GenerateSBOMs
            displayName: "Generate SBOMs"
            variables:
                ${{ if or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/')) }}:
                    sbomProducts: $[ stageDependencies.DetectChanges.Detect.outputs['detect.ChangedProducts'] ]
                ${{ else }}:
                    sbomProducts: $[ stageDependencies.DetectChanges.Detect.outputs['detect.AllProducts'] ]
            steps:
                # Full history: nbgv needs it to work out each package's version.
                - checkout: self
                  fetchDepth: 0

                - template: .azure-pipelines/templates/sbom.yml
                  parameters:
                      products: $(sbomProducts)
                      upload: ${{ or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/')) }}

    - stage: Pack
      displayName: "Build & pack"
      # Depends on Test as well as DetectChanges, so a failing test blocks packing
      # and therefore blocks anything being promoted to NuGet. Depends on
      # GenerateSBOM too, so a license policy violation stops a release.
      dependsOn:
          - DetectChanges
          - Test
          - GenerateSBOM
      # A custom condition REPLACES the implicit succeeded() check, so each
      # dependency's result is checked explicitly. succeeded() can't be used: it is
      # false when a dependency was skipped, and GenerateSBOM is skipped on every
      # branch but release/hotfix. It succeeds with issues when only the
      # Dependency-Track upload failed, which must not block a release.
      condition: |
          and(
            not(canceled()),
            in(dependencies.DetectChanges.result, 'Succeeded', 'SucceededWithIssues'),
            in(dependencies.Test.result, 'Succeeded', 'SucceededWithIssues'),
            in(dependencies.GenerateSBOM.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
            eq(dependencies.DetectChanges.outputs['Detect.detect.AnyChanged'], 'true')
          )
      jobs:
          - job: PackProduct
            displayName: "Pack"
            strategy:
                # Cross-stage output variables need stageDependencies, not dependencies.
                matrix: $[ stageDependencies.DetectChanges.Detect.outputs['detect.BuildMatrix'] ]
            steps:
                # Matrix variable names are deliberately prefixed - a variable named
                # `path` would be exported as PATH and break the whole job. See the
                # note in detect-changes.ps1.
                - template: .azure-pipelines/templates/pack-product.yml
                  parameters:
                      productName: $(productName)
                      productPath: $(productPath)
                      projectPath: $(projectPath)
                      clientName: $(clientName)
